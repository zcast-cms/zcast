name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to publish (e.g. v0.4.0)"
        required: false

permissions:
  contents: write

jobs:
  build:
    name: Build (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-musl
            os: ubuntu-latest
            musl: true
          - target: aarch64-unknown-linux-musl
            os: ubuntu-latest
            musl: true
          - target: aarch64-apple-darwin
            os: macos-14
            musl: false
          - target: x86_64-apple-darwin
            os: macos-14
            musl: false

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup musl cross toolchain
        if: matrix.musl
        uses: taiki-e/setup-cross-toolchain-action@v1
        with:
          target: ${{ matrix.target }}

      - name: Install Rust toolchain (macOS)
        if: "!matrix.musl"
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache Cargo registry & target
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Build release binary
        run: cargo build --release -p zcast-cli --target ${{ matrix.target }}

      - name: Package archive
        shell: bash
        run: |
          mkdir -p dist
          cp "target/${{ matrix.target }}/release/zcast" dist/zcast
          tar -czf "dist/zcast-${{ matrix.target }}.tar.gz" -C dist zcast
          rm -f dist/zcast

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: zcast-${{ matrix.target }}
          path: dist/zcast-${{ matrix.target }}.tar.gz

  publish:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: Generate SHA256SUMS
        working-directory: release-assets
        run: sha256sum zcast-*.tar.gz > SHA256SUMS

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag || github.ref_name }}
          generate_release_notes: true
          files: |
            release-assets/zcast-*.tar.gz
            release-assets/SHA256SUMS
